name: Terraform

on:
  pull_request:
    paths: ["environments/**", "stack/**", "modules/**", "bootstrap/**"]
  push:
    branches: [main]
    paths: ["environments/**", "stack/**", "modules/**"]
  # Staging and prod are never applied automatically - only via this manual
  # trigger (Actions tab > Terraform > Run workflow). Environment protection
  # rules would be the nicer gate, but they require a paid plan on private
  # repos, so the gate lives in the workflow itself.
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write # required to assume the AWS role via OIDC
  contents: read

env:
  TF_VERSION: "1.13.5"
  # Set as repo/environment variables (Settings > Environments) once
  # bootstrap/ has been applied - see bootstrap/README or root README.
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  fmt-and-validate:
    name: fmt & validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [bootstrap, stack]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend - syntax/validate only)
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.root }}
        run: terraform validate

  security-scan:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true # start advisory-only; flip once the backlog it finds is triaged

  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [fmt-and-validate]
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        environment: [dev, staging, prod]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        # backend.hcl is gitignored (account/fork-specific) - generated here
        # from the TF_STATE_BUCKET repo variable set after bootstrap/ is applied.
        working-directory: stack
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ matrix.environment }}/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOF

      - name: terraform init
        working-directory: stack
        # -reconfigure: one directory serves every environment, so without
        # it Terraform offers to migrate the previous state key into this one.
        run: terraform init -backend-config=backend.hcl -reconfigure

      - name: terraform plan
        working-directory: stack
        run: |
          terraform plan -input=false \
            -var-file=../environments/${{ matrix.environment }}.tfvars \
            -var environment=${{ matrix.environment }}

  apply:
    name: apply (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [fmt-and-validate]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    strategy:
      # Push to main auto-applies dev ONLY. Staging/prod come exclusively
      # from the workflow_dispatch input above.
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev"]') }}
      max-parallel: 1
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        # backend.hcl is gitignored (account/fork-specific) - generated here
        # from the TF_STATE_BUCKET repo variable set after bootstrap/ is applied.
        working-directory: stack
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ matrix.environment }}/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOF

      - name: terraform init
        working-directory: stack
        # -reconfigure: one directory serves every environment, so without
        # it Terraform offers to migrate the previous state key into this one.
        run: terraform init -backend-config=backend.hcl -reconfigure

      - name: terraform apply
        working-directory: stack
        run: |
          terraform apply -input=false -auto-approve \
            -var-file=../environments/${{ matrix.environment }}.tfvars \
            -var environment=${{ matrix.environment }}
