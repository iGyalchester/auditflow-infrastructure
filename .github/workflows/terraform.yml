name: Terraform

on:
  pull_request:
    paths: ["environments/**", "modules/**", "bootstrap/**"]
  push:
    branches: [main]
    paths: ["environments/**", "modules/**"]
  # Staging and prod are never applied automatically - only via this manual
  # trigger (Actions tab > Terraform > Run workflow). Environment protection
  # rules would be the nicer gate, but they require a paid plan on private
  # repos, so the gate lives in the workflow itself.
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write # required to assume the AWS role via OIDC
  contents: read

env:
  TF_VERSION: "1.13.5"
  # Set as repo/environment variables (Settings > Environments) once
  # bootstrap/ has been applied - see bootstrap/README or root README.
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  # TEMPORARY diagnostic: decodes the OIDC token claims (not the token
  # itself) so trust-policy mismatches are visible. Remove once CI applies
  # succeed.
  oidc-claims:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Decode OIDC claims
        run: |
          RESP=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          PAYLOAD=$(echo "$RESP" | jq -r '.value' | cut -d. -f2)
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          echo "$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD))" | base64 -d | jq '{iss, aud, sub, repository, environment, ref, repository_owner}'

  fmt-and-validate:
    name: fmt & validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend - syntax/validate only)
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate

  security-scan:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true # start advisory-only; flip once the backlog it finds is triaged

  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [fmt-and-validate]
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        environment: [dev, staging, prod]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        # backend.hcl is gitignored (account/fork-specific) - generated here
        # from the TF_STATE_BUCKET repo variable set after bootstrap/ is applied.
        working-directory: environments/${{ matrix.environment }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ matrix.environment }}/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOF

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend-config=backend.hcl

      - name: terraform plan
        working-directory: environments/${{ matrix.environment }}
        run: terraform plan -var-file=terraform.tfvars -input=false

  apply:
    name: apply (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [fmt-and-validate]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    strategy:
      # Push to main auto-applies dev ONLY. Staging/prod come exclusively
      # from the workflow_dispatch input above.
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev"]') }}
      max-parallel: 1
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        # backend.hcl is gitignored (account/fork-specific) - generated here
        # from the TF_STATE_BUCKET repo variable set after bootstrap/ is applied.
        working-directory: environments/${{ matrix.environment }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ matrix.environment }}/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOF

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend-config=backend.hcl

      - name: terraform apply
        working-directory: environments/${{ matrix.environment }}
        run: terraform apply -var-file=terraform.tfvars -input=false -auto-approve
