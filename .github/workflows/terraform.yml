name: Terraform

on:
  pull_request:
    paths: ["environments/**", "modules/**", "bootstrap/**"]
  push:
    branches: [main]
    paths: ["environments/**", "modules/**"]

permissions:
  id-token: write # required to assume the AWS role via OIDC
  contents: read

env:
  TF_VERSION: "1.13.5"
  # Set as repo/environment variables (Settings > Environments) once
  # bootstrap/ has been applied - see bootstrap/README or root README.
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  fmt-and-validate:
    name: fmt & validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend - syntax/validate only)
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate

  security-scan:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true # start advisory-only; flip once the backlog it finds is triaged

  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [fmt-and-validate]
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        environment: [dev, staging, prod]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        # backend.hcl is gitignored (account/fork-specific) - generated here
        # from the TF_STATE_BUCKET repo variable set after bootstrap/ is applied.
        working-directory: environments/${{ matrix.environment }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ matrix.environment }}/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOF

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend-config=backend.hcl

      - name: terraform plan
        working-directory: environments/${{ matrix.environment }}
        run: terraform plan -var-file=terraform.tfvars -input=false

  apply:
    name: apply (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [fmt-and-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        environment: [dev, staging, prod]
      max-parallel: 1
    # Each matching GitHub Environment can require manual reviewers -
    # gate staging/prod apply on a human clicking "approve" without
    # touching this workflow.
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        # backend.hcl is gitignored (account/fork-specific) - generated here
        # from the TF_STATE_BUCKET repo variable set after bootstrap/ is applied.
        working-directory: environments/${{ matrix.environment }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ matrix.environment }}/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOF

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend-config=backend.hcl

      - name: terraform apply
        working-directory: environments/${{ matrix.environment }}
        run: terraform apply -var-file=terraform.tfvars -input=false -auto-approve
