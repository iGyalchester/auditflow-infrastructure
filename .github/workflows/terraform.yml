name: Terraform

on:
  pull_request:
    paths: ["environments/**", "modules/**", "bootstrap/**"]
  push:
    branches: [main]
    paths: ["environments/**", "modules/**"]
  # Staging and prod are never applied automatically - only via this manual
  # trigger (Actions tab > Terraform > Run workflow). Environment protection
  # rules would be the nicer gate, but they require a paid plan on private
  # repos, so the gate lives in the workflow itself.
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write # required to assume the AWS role via OIDC
  contents: read

env:
  TF_VERSION: "1.13.5"
  # Set as repo/environment variables (Settings > Environments) once
  # bootstrap/ has been applied - see bootstrap/README or root README.
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  # Read-only, and the only role a pull-request workflow can assume.
  AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}

jobs:
  fmt-and-validate:
    name: fmt & validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend - syntax/validate only)
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate

  security-scan:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true # start advisory-only; flip once the backlog it finds is triaged

  # Plans run as a read-only role. The deploy role holds write credentials
  # for the whole account and its trust policy no longer accepts the
  # `pull_request` subject, so a workflow a pull request triggers - including
  # one whose own diff edits this file - cannot assume it.
  #
  # Note the missing `environment:` binding. A job bound to a GitHub
  # Environment presents `environment:<name>` as its OIDC subject rather than
  # `pull_request`, so binding it here would defeat the trust policy that
  # makes this role safe.
  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [fmt-and-validate]
    # Skips itself until AWS_PLAN_ROLE_ARN is set, rather than failing on
    # empty credentials. Deliberately not falling back to AWS_ROLE_ARN: an
    # unset variable should mean "no plan", never "plan with write access".
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show which identity the plan is using
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        # backend.hcl is gitignored (account/fork-specific) - generated here
        # from the TF_STATE_BUCKET repo variable set after bootstrap/ is applied.
        working-directory: environments/${{ matrix.environment }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ matrix.environment }}/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOF

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend-config=backend.hcl

      # -lock=false because taking a state lock is a write, and this role
      # cannot write. A stale read on a pull-request plan is harmless: the
      # plan is advisory and apply re-plans under a real lock.
      - name: terraform plan
        working-directory: environments/${{ matrix.environment }}
        run: terraform plan -var-file=terraform.tfvars -input=false -lock=false

  apply:
    name: apply (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [fmt-and-validate]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    strategy:
      # Push to main auto-applies dev ONLY. Staging/prod come exclusively
      # from the workflow_dispatch input above.
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev"]') }}
      max-parallel: 1
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        # backend.hcl is gitignored (account/fork-specific) - generated here
        # from the TF_STATE_BUCKET repo variable set after bootstrap/ is applied.
        working-directory: environments/${{ matrix.environment }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ matrix.environment }}/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOF

      - name: terraform init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend-config=backend.hcl

      - name: terraform apply
        working-directory: environments/${{ matrix.environment }}
        run: terraform apply -var-file=terraform.tfvars -input=false -auto-approve
